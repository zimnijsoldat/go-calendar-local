name: Update calendar

on:
  schedule:
    # Upstream regenerates around 06:30 UTC; run after it, plus a midday catch-up.
    - cron: "15 8 * * *"
    - cron: "15 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert feed
        run: python convert.py gocal-melbourne.ics
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gocal-melbourne.ics
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update calendar"
            git push
          fi
